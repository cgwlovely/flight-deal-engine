[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flight-deal-engine"
version = "0.1.0"
description = "Scan live airfares across many destinations at once and rank them by how good a deal they actually are."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fast-flights>=3.0",
    "typing-extensions>=4.9",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
flightdeals = "flightdeals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flightdeals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"data/airports.yaml" = "flightdeals/data/airports.yaml"
